name: Delegate release candidate

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-arm64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: '1.4.4'
      - run: bun scripts/check.ts
      - run: sh skills/build-queue/scripts/build-queue.test.sh
      - run: python3 -I skills/watch-pr/scripts/pr-watch.test.py
      - name: Build, test and package
        working-directory: tools/delegate
        run: |
          bun install --frozen-lockfile
          bun run build
          bun run test
          xcrun swiftc -typecheck notifier/notifier.swift
          bun run package
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: delegate-darwin-arm64
          path: tools/delegate/dist/delegate-*.tar.gz*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: macos-arm64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7.0.0
        with:
          name: delegate-darwin-arm64
      - run: gh release create "$GITHUB_REF_NAME" delegate-*.tar.gz* --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
